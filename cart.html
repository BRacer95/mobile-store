<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - KICKS</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
      <div class="nav-action-btns" style="margin:20px 0;display:flex;justify-content:center;gap:18px;">
        <a href="index.html" class="header-action-btn" aria-label="home" style="display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#43e97b,#38f9d7);border-radius:8px;padding:8px 22px;text-decoration:none;color:#fff;font-weight:700;box-shadow:0 2px 12px #b2f7ef;outline:none;transition:box-shadow 0.2s;">
          <ion-icon name="home-outline" aria-hidden="true"></ion-icon> Home
        </a>
        <a href="cart.html" class="header-action-btn active" aria-label="cart" style="display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#3a8dde,#005bea);border-radius:8px;padding:8px 22px;text-decoration:none;color:#fff;font-weight:700;box-shadow:0 2px 12px #b2d7ff;outline:none;transition:box-shadow 0.2s;">
          <ion-icon name="bag-handle-outline" aria-hidden="true"></ion-icon> Cart
        </a>
        <a href="wishlist.html" class="header-action-btn" aria-label="favorite list" style="display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#ff7eb3,#ff758c);border-radius:8px;padding:8px 22px;text-decoration:none;color:#fff;font-weight:700;box-shadow:0 2px 12px #ffd7e0;outline:none;transition:box-shadow 0.2s;">
          <ion-icon name="heart-outline" aria-hidden="true"></ion-icon> Wishlist
        </a>
      </div>
    </header>
    <main>
        <h1>Your Cart</h1>
        <div class="cart-container" style="max-width:900px;margin:0 auto;">
          <div class="cart-header" style="display:grid;grid-template-columns:90px 1.5fr 1fr 120px 1fr 110px;align-items:center;background:#f1f3f6;padding:12px 0;border-radius:8px;font-weight:600;color:#222;text-align:center;">
            <span>Image</span>
            <span>Product</span>
            <span>Price</span>
            <span>Quantity</span>
            <span>Subtotal</span>
            <span>Action</span>
          </div>
          <section id="cart-items">
            <!-- Cart items will be loaded dynamically here -->
          </section>
        </div>
        <div class="cart-summary">
          <span id="cart-total-label">Total:</span>
          <span id="cart-total">₹0</span>
          <button class="checkout-btn">Checkout</button>
        </div>
    </main>
  <script src="assets/js/script.js"></script>
  <script src="cart.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>
</html>
